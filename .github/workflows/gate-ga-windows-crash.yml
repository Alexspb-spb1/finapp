name: Gate G-A Windows crash-window verification

on:
  push:
    branches:
      - remediation/SEC-006-GATE-GA-APPROVAL-EVIDENCE-BINDING-winverify

permissions:
  contents: read

jobs:
  crash-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify package bytes from Windows checkout
        shell: bash
        run: |
          node -e 'const fs=require("fs"),crypto=require("crypto"),path=require("path");const dir="scripts/invitationRehearsal";const lines=fs.readFileSync(path.join(dir,"CODE-SHA256SUMS.txt"),"utf8").trim().split("\n");let bad=0;for(const line of lines){const m=/^([a-f0-9]{64})\s+\*?(.+)$/.exec(line.trimEnd());if(!m)throw Error("invalid manifest");const actual=crypto.createHash("sha256").update(fs.readFileSync(path.join(dir,m[2]))).digest("hex");if(actual!==m[1]){console.error("PACKAGE_BYTE_MISMATCH",m[2]);bad++}}if(bad)process.exit(1);console.log("PACKAGE_BYTES_VERIFIED",lines.length)'
      - run: npm ci
      - run: npm run test:invitation-gate-ga-secure-executor
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - name: Verify Windows PowerShell ACL module
        shell: powershell
        run: |
          Import-Module Microsoft.PowerShell.Security -ErrorAction Stop
          Get-Acl -Path . | Out-Null
          powershell.exe -NoProfile -NonInteractive -Command "Get-Acl -Path . | Out-Null"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Eight literal-CLI crash windows
        shell: powershell
        run: .\node_modules\.bin\firebase.cmd emulators:exec --project demo-finapp --only auth,firestore,functions "node scripts/invitationRehearsal/gateGaCrashWindowsCliTest.mjs"
